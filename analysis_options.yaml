# Static analysis configuration for VKU Expense OCR.
#
# Starts from the official Flutter lint set and turns on stricter type checks
# plus extra rules that match the course slides (const widgets, final locals,
# no print, safe BuildContext usage across async gaps).
#
# Run with `flutter analyze`. The project goal is 0 issues (NFR-5).

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Types and declarations
    - always_declare_return_types
    - type_annotate_public_apis
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_final_fields
    - prefer_final_in_for_each
    - use_super_parameters

    # const usage (W7 s15-16, NFR-2)
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables

    # Async safety
    - unawaited_futures
    - avoid_void_async
    - use_build_context_synchronously
    - cancel_subscriptions
    - close_sinks

    # Style and hygiene
    - avoid_print
    - always_use_package_imports
    - directives_ordering
    - prefer_single_quotes
    - sort_child_properties_last
    - avoid_unnecessary_containers
    - avoid_redundant_argument_values
    - only_throw_errors
    - use_key_in_widget_constructors
